<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#18251f">
<title>Dream Homes – Renovation & Life</title>
<meta name="description" content="Dream Homes – ein kleines 3D-Renovierungsspiel für dein iPad">
<style>
:root{--bg:#18251f;--panel:#24352d;--panel2:#31463a;--gold:#e7bd72;--cream:#fff8ea;--muted:#c6d0c8}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101813;color:var(--cream);font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#top{position:fixed;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;gap:6px;pointer-events:none}.pill{background:#18251fdf;border:1px solid #ffffff25;border-radius:16px;padding:8px 10px;font-size:12px}#brand{font-weight:800;letter-spacing:.5px;color:var(--gold)}
#toolbar{position:fixed;left:8px;right:8px;bottom:12px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}button{border:1px solid #ffffff26;background:var(--panel);color:var(--cream);border-radius:13px;padding:10px 12px;font-weight:700;font-size:13px;box-shadow:0 4px 14px #0004;touch-action:manipulation}button:active{transform:scale(.97);background:var(--panel2)}
#hint{position:fixed;top:55px;left:50%;transform:translateX(-50%);max-width:90%;text-align:center;background:#18251fdd;border:1px solid #ffffff20;border-radius:12px;padding:8px 12px;font-size:12px;color:var(--muted);pointer-events:none}#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:14px;touch-action:pan-y}#modal.show{display:flex}.sheet{width:min(520px,100%);max-height:82vh;overflow:auto;background:var(--bg);border:1px solid #ffffff2b;border-radius:22px;padding:16px;box-shadow:0 20px 70px #0009;touch-action:pan-y}.sheet h2{margin:0;color:var(--gold);font-size:20px}.sheet p{color:var(--muted);font-size:13px;line-height:1.4}.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{background:var(--panel);border:1px solid #ffffff20;border-radius:14px;padding:11px}.item b{display:block;margin-bottom:4px}.item small{display:block;color:var(--muted);margin-bottom:8px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 0 12px}.item button{width:100%}
.stylegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stylecard{border:1px solid #ffffff25;border-radius:13px;padding:10px;background:linear-gradient(135deg,#31463a,#1b2922)}.swatches{display:flex;gap:5px;margin:7px 0}.swatches i{width:18px;height:18px;border-radius:50%;border:1px solid #ffffff55;display:block}.categorybar{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}.categorybar button{white-space:nowrap;padding:8px 10px;font-size:12px}.selected{outline:2px solid var(--gold)}#stick{position:fixed;left:18px;bottom:105px;width:116px;height:116px;border-radius:50%;background:#18251f70;border:2px solid #ffffff44;display:block;touch-action:none}#nub{position:absolute;width:46px;height:46px;left:33px;top:33px;border-radius:50%;background:#e7bd72cc;border:2px solid #fff8;pointer-events:none}#looktip{position:fixed;right:16px;bottom:115px;color:#fff9;font-size:11px;text-shadow:0 1px 4px #000;pointer-events:none}
@media(min-width:800px){#stick{opacity:.65}}
</style>
</head>
<body>
<div id="game"></div>
<div id="top"><div class="pill" id="brand">🏡 DREAM HOMES</div><div class="pill">💶 <span id="money">5.000</span> €</div><div class="pill">⭐ Level <span id="level">1</span></div></div>
<div id="hint">Links bewegen · rechts ziehen zum Umsehen · Menüs unten öffnen</div>
<div id="stick"><div id="nub"></div></div><div id="looktip">RECHTS ZIEHEN: UMSCHAUEN</div>
<div id="toolbar"><button onclick="openPanel('jobs')">🧰 Jobs</button><button onclick="openPanel('shop')">🛍️ Inventar</button><button onclick="openPanel('styles')">🎨 Styles</button><button onclick="openPanel('renovate')">🎨 Renovieren</button><button onclick="openPanel('houses')">🏠 Häuser</button><button onclick="saveGame()">💾 Speichern</button></div>
<div id="modal"><div class="sheet"><div class="row"><h2 id="panelTitle">Dream Homes</h2><button onclick="closePanel()">✕</button></div><div id="panelBody"></div></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const mount=document.querySelector('#game');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db8bd);scene.fog=new THREE.Fog(0x9db8bd,22,55);
const camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,100);camera.rotation.order='YXZ';camera.position.set(0,1.65,9.5);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;mount.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe7f4ff,0x657052,2));const sun=new THREE.DirectionalLight(0xffedcf,2.2);sun.position.set(-5,10,6);sun.castShadow=true;scene.add(sun);
const mat=(color,rough=.85)=>new THREE.MeshStandardMaterial({color,roughness:rough});let wallColor=0xe8dfcf,floorColor=0x9a7653,money=5000,xp=0,level=1,owned=[0],currentHouse=0;let roomGroup=new THREE.Group();scene.add(roomGroup);let placed=[];let selected=null;
function box(parent,w,h,d,material,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;parent.add(mesh);return mesh}
const homes=[{name:'Kleines Stadthaus',region:'Grüne Vorstadt',price:0,desc:'Dein erstes Renovierungsprojekt'},{name:'Familienhaus',region:'Sonnenviertel',price:18000,desc:'Mit Garten und zwei Schlafzimmern'},{name:'Villa am See',region:'Seeregion',price:95000,desc:'Große Fenster und Terrasse'},{name:'Altbauwohnung',region:'Altstadt',price:32000,desc:'Hohe Decken und Charakter'},{name:'Landhaus',region:'Landregion',price:57000,desc:'Großer Garten'}];
const styles=[
['Skandinavisch','Helle Hölzer, Creme und klare Formen',[0xe8dfcf,0xc6b69c,0x9a7653]],['Luxus','Marmor, Messing und Samt',[0xd8c9b4,0x9c8060,0x34343a]],['Boho','Naturmaterialien, Rattan und warme Töne',[0xc79b70,0x80634d,0x64745a]],['Industrial','Metall, Beton und dunkles Holz',[0x777777,0x393d40,0x76563f]],['Minimalistisch','Reduziert, ruhig und hell',[0xf2f0e9,0xbab8b0,0x777777]],['Klassisch','Zeitlose Formen und edle Stoffe',[0xe2d5c1,0x73543e,0x9b835f]],['Landhaus','Gemütlich, Holz und sanfte Farben',[0xe8dfcf,0xa7b09a,0x8a6d50]],['Mediterran','Terrakotta, Stein und Olivenholz',[0xc77e59,0xe0c69e,0x6c7654]],['Japandi','Japanische Ruhe trifft skandinavische Wärme',[0xd8c8ad,0x8a765e,0xaaa69a]],['Mid-Century','Retro-Holz und klare Silhouetten',[0x9a6745,0xd4a65c,0x55716c]],['Art Déco','Geometrie, Gold und dunkle Eleganz',[0x273b43,0xc5a15a,0xd7c7ae]],['Vintage','Gebrauchter Charme und verspielte Details',[0x9b7656,0x718b86,0xd7c7ae]],['Coastal','Sand, Weiß und Meeresfarben',[0xe9e2d4,0x9db8bd,0x6f8f91]],['Dark Academia','Dunkles Holz, Leder und Bücherzimmer',[0x49382e,0x6f5947,0x8a765e]],['Modern Farmhouse','Rustikale Wärme mit modernen Linien',[0xe5dfd3,0x8c765e,0x6d7866]],['Maximalistisch','Mutige Farben und Muster-Mix',[0xc56b55,0x4c6b72,0xd4a94f]],['Urban Modern','Zeitgenössisch und city-inspiriert',[0x777d82,0xc2b7a7,0x3d4a50]],['Rustikal','Naturstein und massives Holz',[0x8b6a4d,0xaaa08d,0x5e5148]],['Gothic','Dunkle Töne und dramatische Akzente',[0x302b35,0x66505d,0x9b835f]],['Soft Pastel','Sanfte Pastellfarben und leichte Formen',[0xe8cfd2,0xc9dce3,0xd9d1bd]]
];let activeStyle=0;
const catalog=[
{id:'sofa',name:'Sofa',category:'Wohnzimmer',price:450,w:2.3,h:.8,d:.9,color:0x718b86},{id:'bed',name:'Doppelbett',category:'Schlafzimmer',price:700,w:2.2,h:.55,d:2,color:0xd7c7ae},{id:'table',name:'Couchtisch',category:'Wohnzimmer',price:180,w:1.2,h:.42,d:.7,color:0x8b6444},{id:'chair',name:'Designstuhl',category:'Esszimmer',price:120,w:.65,h:.9,d:.65,color:0x9b7656},{id:'plant',name:'Zimmerpflanze',category:'Deko',price:90,w:.55,h:1.1,d:.55,color:0x52784d},{id:'wardrobe',name:'Kleiderschrank',category:'Schlafzimmer',price:520,w:1.4,h:2.2,d:.65,color:0xe4dfd2},{id:'lamp',name:'Stehlampe',category:'Beleuchtung',price:150,w:.35,h:1.7,d:.35,color:0xc7a96d},{id:'desk',name:'Schreibtisch',category:'Arbeitszimmer',price:300,w:1.5,h:.75,d:.7,color:0x795b43},
{id:'armchair',name:'Sessel',category:'Wohnzimmer',price:260,w:1,h:.85,d:.9,color:0x9b7656},{id:'diningtable',name:'Esstisch',category:'Esszimmer',price:390,w:1.8,h:.78,d:1,color:0x9a7653},{id:'bookshelf',name:'Bücherregal',category:'Deko',price:340,w:1.2,h:2,d:.35,color:0x795b43},{id:'dresser',name:'Kommode',category:'Schlafzimmer',price:280,w:1.3,h:.9,d:.5,color:0xb7a18a},{id:'rug',name:'Teppich',category:'Deko',price:160,w:2,h:.08,d:1.5,color:0xb99a7a},{id:'tv',name:'Fernseher',category:'Wohnzimmer',price:620,w:1.5,h:.9,d:.12,color:0x25282a},{id:'cabinet',name:'Unterschrank',category:'Küche',price:310,w:1.2,h:.9,d:.6,color:0xe4dfd2},{id:'mirror',name:'Standspiegel',category:'Deko',price:190,w:.7,h:1.8,d:.12,color:0xc7a96d},{id:'bathtub',name:'Badewanne',category:'Badezimmer',price:850,w:1.8,h:.65,d:.8,color:0xf1eee8},{id:'plant2',name:'Große Pflanze',category:'Deko',price:140,w:.8,h:1.5,d:.8,color:0x52784d},{id:'sideboard',name:'Sideboard',category:'Wohnzimmer',price:410,w:1.7,h:.75,d:.45,color:0x8b6444},{id:'stool',name:'Hocker',category:'Esszimmer',price:75,w:.45,h:.48,d:.45,color:0x9b7656}
];
function addFurniture(id,x=0,z=0,pay=false){const item=catalog.find(a=>a.id===id);if(!item)return null;if(pay&&money<item.price){toast('Nicht genug Geld!');return null;}if(pay)money-=item.price;const group=new THREE.Group();const body=box(group,item.w,item.h,item.d,mat(item.color),0,item.h/2,0);body.userData.furniture=true;group.position.set(x,0,z);group.userData={id,name:item.name};roomGroup.add(group);placed.push(group);updateHUD();return group;}
function buildHouse(){while(roomGroup.children.length)roomGroup.remove(roomGroup.children[0]);placed=[];const floor=box(roomGroup,12,.2,12,mat(floorColor),0,-.12,0);floor.userData.floor=true;const wallMat=mat(wallColor);box(roomGroup,12,3,.22,wallMat,0,1.4,-6);box(roomGroup,.22,3,12,wallMat,-6,1.4,0);box(roomGroup,.22,3,12,wallMat,6,1.4,0);box(roomGroup,4.1,3,.22,wallMat,-3.95,1.4,6);box(roomGroup,4.1,3,.22,wallMat,3.95,1.4,6);box(roomGroup,12,.18,12,mat(0x6f8b62),0,-.32,0);const roof=box(roomGroup,12,.2,12,mat(0x59685e),0,3.05,0);roof.visible=false;addFurniture('sofa',-2,1,false);addFurniture('table',-1,2.3,false);addFurniture('plant',4,3,false);}
function updateHUD(){document.querySelector('#money').textContent=Math.floor(money).toLocaleString('de-DE');document.querySelector('#level').textContent=level;}
let yaw=0,pitch=0;buildHouse();updateHUD();
function toast(message){const hint=document.querySelector('#hint');hint.textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>hint.textContent='Links bewegen · rechts ziehen zum Umsehen · Menüs unten öffnen',2300);}
function closePanel(){document.querySelector('#modal').classList.remove('show');}
function openPanel(which){const modal=document.querySelector('#modal'),title=document.querySelector('#panelTitle'),body=document.querySelector('#panelBody');modal.classList.add('show');if(which==='shop'){title.textContent='🛍️ Inventar & Möbel';const cats=['Alle',...new Set(catalog.map(i=>i.category))];body.innerHTML=`<p>Wähle Möbel aus und kaufe sie für dein Haus. Dein aktueller Stil: <b>${styles[activeStyle][0]}</b></p><div class="categorybar">${cats.map(c=>`<button onclick="showCategory('${c}')">${c}</button>`).join('')}</div><div id="catalogItems" class="items">${catalog.map(i=>`<div class="item"><b>${i.name}</b><small>${i.category} · ${i.price.toLocaleString('de-DE')} €</small><button onclick="buyItem('${i.id}')">Kaufen</button></div>`).join('')}</div>`;}else if(which==='styles'){title.textContent='🎨 20 Einrichtungsstile';body.innerHTML=`<p>Wähle eine Stilrichtung als Inspiration für deine Einrichtung. Du kannst Möbel frei kombinieren.</p><div class="stylegrid">${styles.map((st,i)=>`<div class="stylecard"><b>${i+1}. ${st[0]}</b><p>${st[1]}</p><div class="swatches">${st[2].map(c=>`<i style="background:#${c.toString(16).padStart(6,'0')}"></i>`).join('')}</div><button onclick="chooseStyle(${i})">${activeStyle===i?'Ausgewählt':'Stil wählen'}</button></div>`).join('')}</div>`;}else if(which==='jobs'){title.textContent='🧰 Jobs';body.innerHTML=`<div class="items">${[['Wände streichen',650,25],['Grundreinigung',420,15],['Boden erneuern',850,35],['Gartenpflege',500,20],['Möbel montieren',700,30],['Kleine Reparatur',550,20]].map(j=>`<div class="item"><b>${j[0]}</b><small>Belohnung: ${j[1]} € · ${j[2]} XP</small><button onclick="job(${j[1]},${j[2]})">Auftrag erledigen</button></div>`).join('')}</div>`;}else if(which==='renovate'){title.textContent='🎨 Renovieren';const colors=[[0xe8dfcf,'Creme'],[0xe1e8e1,'Salbei'],[0xc7d7e2,'Hellblau'],[0xd8c5d5,'Altrosa'],[0xffffff,'Weiß'],[0xb7a18a,'Sand']];const floors=[[0x9a7653,'Eiche'],[0x5e5148,'Dunkles Holz'],[0xc7c1b4,'Stein'],[0xd9c9a8,'Heller Boden']];body.innerHTML=`<h3>Wandfarben</h3><div class="items">${colors.map(c=>`<div class="item"><b>${c[1]}</b><button onclick="paintWall(${c[0]})">Auswählen</button></div>`).join('')}</div><h3>Böden</h3><div class="items">${floors.map(c=>`<div class="item"><b>${c[1]}</b><button onclick="paintFloor(${c[0]})">Auswählen</button></div>`).join('')}</div>`;}else if(which==='houses'){title.textContent='🏠 Immobilienmarkt';body.innerHTML=`<div class="items">${homes.map((h,i)=>`<div class="item"><b>${h.name}</b><small>${h.region}<br>${h.desc}<br>${h.price.toLocaleString('de-DE')} €</small><button onclick="buyHouse(${i})">${owned.includes(i)?'Betreten':'Kaufen'}</button></div>`).join('')}</div><p>Hinweis: In dieser ersten Version sind die Immobilien noch mit demselben Grundriss dargestellt.</p>`;}}
function showCategory(category){const list=document.querySelector('#catalogItems');if(!list)return;const items=category==='Alle'?catalog:catalog.filter(i=>i.category===category);list.innerHTML=items.map(i=>`<div class="item"><b>${i.name}</b><small>${i.category} · ${i.price.toLocaleString('de-DE')} €</small><button onclick="buyItem('${i.id}')">Kaufen</button></div>`).join('');}
function chooseStyle(index){activeStyle=index;const palette=styles[index][2];wallColor=palette[0];floorColor=palette[1];buildHouse();toast('Stil gewählt: '+styles[index][0]);openPanel('styles');}
function buyItem(id){const item=catalog.find(a=>a.id===id);if(!item||money<item.price){toast('Nicht genug Geld!');return;}const x=Math.max(-4,Math.min(4,camera.position.x-Math.sin(yaw)*2));const z=Math.max(-4,Math.min(4,camera.position.z-Math.cos(yaw)*2));addFurniture(id,x,z,true);toast(item.name+' gekauft!');updateHUD();}
function job(reward,points){money+=reward;xp+=points;if(xp>=100){level++;xp-=100;toast('Neues Level erreicht!');}else toast('Auftrag erledigt! +'+reward+' €');updateHUD();openPanel('jobs');}
function paintWall(color){wallColor=color;buildHouse();updateHUD();toast('Wandfarbe geändert!');}
function paintFloor(color){floorColor=color;buildHouse();updateHUD();toast('Boden geändert!');}
function buyHouse(i){const h=homes[i];if(!owned.includes(i)){if(money<h.price){toast('Nicht genug Geld!');return;}money-=h.price;owned.push(i);}currentHouse=i;buildHouse();updateHUD();toast(h.name+' betreten!');openPanel('houses');}
function saveGame(){try{localStorage.setItem('dreamHomesSave',JSON.stringify({money,xp,level,owned,currentHouse,wallColor,floorColor,activeStyle}));toast('Spielstand gespeichert!');}catch(e){toast('Speichern nicht verfügbar.');}}
function loadGame(){try{const s=JSON.parse(localStorage.getItem('dreamHomesSave'));if(!s)return;money=s.money??5000;xp=s.xp??0;level=s.level??1;owned=s.owned??[0];currentHouse=s.currentHouse??0;wallColor=s.wallColor??0xe8dfcf;floorColor=s.floorColor??0x9a7653;activeStyle=s.activeStyle??0;buildHouse();updateHUD();}catch(e){}}
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');let stickId=null,moveX=0,moveY=0;function stickMove(e){const r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),m=37;const x=len>m?dx/len*m:dx,y=len>m?dy/len*m:dy;nub.style.transform=`translate(${x}px,${y}px)`;moveX=x/m;moveY=y/m;}function resetStick(){stickId=null;moveX=moveY=0;nub.style.transform='translate(0,0)';}stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
let dragging=null;renderer.domElement.addEventListener('pointerdown',e=>{if(e.clientX>innerWidth*.38)dragging={x:e.clientX,y:e.clientY};});renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragging.x,dy=e.clientY-dragging.y;yaw-=dx*.005;pitch=Math.max(-1.1,Math.min(1.1,pitch-dy*.004));dragging={x:e.clientX,y:e.clientY};});renderer.domElement.addEventListener('pointerup',()=>dragging=null);renderer.domElement.addEventListener('pointercancel',()=>dragging=null);
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.04);last=now;let mx=moveX,mz=moveY;if(keys.d||keys.arrowright)mx++;if(keys.a||keys.arrowleft)mx--;if(keys.s||keys.arrowdown)mz++;if(keys.w||keys.arrowup)mz--;const len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len;}const speed=3.2;camera.position.x+=(Math.cos(yaw)*mx+Math.sin(yaw)*mz)*speed*dt;camera.position.z+=(-Math.sin(yaw)*mx+Math.cos(yaw)*mz)*speed*dt;camera.position.x=Math.max(-15,Math.min(15,camera.position.x));camera.position.z=Math.max(-17,Math.min(13,camera.position.z));camera.rotation.set(pitch,yaw,0);renderer.render(scene,camera);}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});loadGame();Object.assign(window,{openPanel,closePanel,saveGame,buyItem,buyHouse,job,paintWall,paintFloor,showCategory,chooseStyle});
</script>
</body>
</html>
